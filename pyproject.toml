[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "simple-harness-service-sdk"
version = "0.3.20"
description = "Thin authenticated service framework for Simple Harness SDK"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "DennyWanye"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "simple-harness-sdk>=0.13.0.dev20260925",
  "packaging>=25,<27",
  "prompt-toolkit>=3.0.52,<4",
]

[project.optional-dependencies]
memory = [
  "simple-harness-memory-sdk @ https://github.com/DennyWanye/simple-harness-memory-sdk/releases/download/v0.5.2/simple_harness_memory_sdk-0.5.2-py3-none-any.whl#sha256=deff2fa85a269a3978f2c6efcd99fda77abcb74444170361365fd00ec0164e9e",
]
realtime = [
  "httpx>=0.28.1,<1",
  "websockets>=15,<16",
]

[project.scripts]
simple-harness-service = "simple_harness_service.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/simple_harness_service"]

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "hatchling>=1.27,<2",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "twine>=7,<8",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["simple_harness_service"]
